<!-- templates/index.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Advanced Python Multiplayer Chess</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        #board {
            width: 500px;
            margin: 20px auto;
        }
        #controls {
            text-align: center;
            margin: 20px;
        }
        #status {
            text-align: center;
            font-size: 1.2em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="createGameBtn">Create Game</button>
        <br><br>
        <input type="text" id="roomInput" placeholder="Enter room ID to join">
        <button id="joinGameBtn">Join Game</button>
    </div>
    <div id="status"></div>
    <div id="board"></div>

    <!-- Include libraries from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/1.0.0/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script>
        var socket = io();
        var board = null;
        var game = new Chess();
        var room = null;
        var playerColor = null;

        // Board configuration
        var config = {
            draggable: true,
            position: 'start',
            onDrop: onDrop,
            orientation: 'white'
        };

        // Move handler: sends move if legal and if it's player's turn
        function onDrop(source, target) {
            // Ensure player's turn: game.turn() returns 'w' or 'b'
            if ((game.turn() === 'w' && playerColor !== 'white') ||
                (game.turn() === 'b' && playerColor !== 'black')) {
                return 'snapback';
            }
            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) {
                return 'snapback';
            }
            // Emit move event to server (using UCI string: e.g., "e2e4")
            socket.emit('move', { room: room, move: source + target });
        }

        // Initialize the chessboard
        function initBoard() {
            board = Chessboard('board', config);
        }

        // Button event listeners
        document.getElementById('createGameBtn').addEventListener('click', function(){
            socket.emit('createGame', {});
        });

        document.getElementById('joinGameBtn').addEventListener('click', function(){
            var roomID = document.getElementById('roomInput').value;
            socket.emit('joinGame', { room: roomID });
        });

        // SocketIO event listeners
        socket.on('gameCreated', function(data){
            room = data.room;
            playerColor = data.color;
            config.orientation = 'white'; // Creator ke liye white
            initBoard();
            document.getElementById('status').innerText = 'Game created! Share Room ID: ' + room;
        });

        socket.on('gameJoined', function(data){
            room = data.room;
            playerColor = data.color;
            config.orientation = (playerColor === 'white') ? 'white' : 'black';
            initBoard();
            game.load(data.fen);
            board.position(data.fen);
            document.getElementById('status').innerText = 'Joined game as ' + playerColor;
        });

        socket.on('gameStart', function(data){
            game.load(data.fen);
            board.position(data.fen);
            document.getElementById('status').innerText = 'Game started!';
        });

        socket.on('move', function(data){
            game.load(data.fen);
            board.position(data.fen);
        });

        socket.on('invalidMove', function(data){
            alert(data.message);
            board.position(game.fen());
        });

        socket.on('gameOver', function(data){
            document.getElementById('status').innerText = 'Game Over: ' + data.result;
        });

        socket.on('opponentLeft', function(data){
            document.getElementById('status').innerText = data.message;
        });
    </script>
</body>
</html>
